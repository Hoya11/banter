<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>banter</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0 auto;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 640px;
      }
      header { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #8883; }
      #session-panel {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid #8883;
      }
      #session-status { margin: 0; font-size: 14px; opacity: 0.75; }
      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
      .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; line-height: 1.4; }
      .user { align-self: flex-end; background: #2563eb; color: #fff; }
      .ai_a { align-self: flex-start; background: #8882; }
      .ai_b { align-self: flex-start; background: #10b98133; }
      .name { font-size: 11px; opacity: 0.6; margin-bottom: 2px; }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #8883; }
      input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #8886; font-size: 15px; }
      button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      #session-start { flex: none; }
      #mic { background: #8884; }
      #mic.rec { background: #dc2626; }
    </style>
  </head>
  <body>
    <header>banter: 도현, 소은과 수다</header>
    <section id="session-panel" aria-label="대화 상태">
      <p id="session-status" role="status" aria-live="polite">준비되면 대화를 시작하세요.</p>
      <button type="button" id="session-start">대화 시작</button>
    </section>
    <div id="log"></div>
    <form id="form">
      <button type="button" id="mic" hidden disabled title="누르는 동안 녹음돼요" aria-label="누르는 동안 녹음" aria-pressed="false">말하기</button>
      <input id="msg" autocomplete="off" placeholder="대화를 시작해 주세요." disabled />
      <button id="send" disabled>전송</button>
    </form>
    <script>
      const NAMES = { user: '나', ai_a: '도현', ai_b: '소은' };
      const log = document.getElementById('log');
      const statusEl = document.getElementById('session-status');
      const startBtn = document.getElementById('session-start');
      const form = document.getElementById('form');
      const input = document.getElementById('msg');
      const sendBtn = document.getElementById('send');
      const micBtn = document.getElementById('mic');
      let ws = null;
      let sessionState = 'idle';
      let connectionEpoch = 0;
      let voiceMode = false;
      let sttAvailable = false;
      let current = null;
      let pendingStt = null;
      let voiceRequestClientEventId = null;
      let activeSessionId = null;
      let clientEventSequence = 0;
      let activeHoldEventId = null;
      let suppressAudioUntilNextTurn = false;
      let audioSuppressionClientEventId = null;

      function setSessionState(next, message) {
        sessionState = next;
        statusEl.textContent = message;
        const running = next === 'running';
        input.disabled = !running;
        sendBtn.disabled = !running;
        micBtn.disabled = !running || !sttAvailable;
        micBtn.hidden = !running || !sttAvailable;
        startBtn.disabled = next === 'starting' || running;
        startBtn.textContent = next === 'ended' || next === 'error' ? '다시 시작' : '대화 시작';
        input.placeholder = running ? '말 걸거나 끼어들어보세요…' : '대화를 시작해 주세요.';
        if (running) input.focus();
      }

      function safeSend(payload, socket = ws) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(payload));
          return true;
        }
        return false;
      }

      function clearVoiceRequest(clientEventId = null) {
        if (clientEventId && voiceRequestClientEventId !== clientEventId) return false;
        if (pendingStt) pendingStt.wrap.remove();
        pendingStt = null;
        voiceRequestClientEventId = null;
        return true;
      }

      function add(speaker, text) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + speaker;
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = NAMES[speaker] || speaker;
        const body = document.createElement('div');
        body.textContent = text;
        wrap.append(name, body);
        log.append(wrap);
        log.scrollTop = log.scrollHeight;
        if (speaker === 'user') lastAi = null; // 유저 발화가 끼면 AI 문장 이어붙이기 끊김
        return { wrap, body, speaker };
      }
      let lastAi = null; // 문장 단위 자막을 같은 발화 말풍선에 이어붙이기 위한 참조
      function showSentence(item) {
        if (item.cont && lastAi && lastAi.speaker === item.speaker) {
          lastAi.body.textContent += ' ' + item.text; // 같은 발화의 다음 문장
          log.scrollTop = log.scrollHeight;
        } else {
          lastAi = add(item.speaker, item.text);
        }
      }

      // 발화 오디오 순차 재생 — 단일 Audio 엘리먼트 재사용.
      // 브라우저 autoplay 정책상 사용자 제스처로 한번 재생된 엘리먼트만
      // 이후 프로그램 재생이 허용되므로, 첫 전송 때 무음으로 unlock한다.
      const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
      const player = new Audio();
      const audioQueue = [];
      let playing = false;
      let playbackStarted = false;
      let unlocked = false;
      player.onended = () => playNext();
      player.onerror = () => playNext();

      // 시작 버튼의 사용자 제스처 안에서 오디오 재생 권한을 먼저 확보한다.
      async function unlockAudio() {
        if (unlocked) return true;
        player.src = SILENT_WAV;
        try {
          await player.play();
          player.pause();
          unlocked = true;
          hideSoundHint();
          return true;
        } catch (_) {
          return false;
        }
      }

      function showSoundHint() {
        let el = document.getElementById('soundhint');
        if (!el) {
          el = document.createElement('div');
          el.id = 'soundhint';
          el.textContent = '화면을 한 번 탭하면 목소리가 재생돼요';
          el.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#2563eb;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:9';
          document.body.append(el);
        }
      }
      function hideSoundHint() {
        const el = document.getElementById('soundhint');
        if (el) el.remove();
      }

      // 음성 동기 모드: 말풍선은 그 발화의 오디오가 "재생되는 순간" 표시한다(자막).
      // 항목마다 서버가 준 seq로 played ack — 서버는 max(acked, seq)만 기억하므로
      // 중복 ack은 무해하고(멱등), stale 콜백의 이중 ack 문제도 사라진다.
      let generation = 0; // stopAudio마다 증가 — 이전 재생의 늦은 콜백을 무시
      let flushUpTo = 0; // 서버 flush 지시: 이 seq 이하 오디오는 stale — 표시 없이 ack만
      let currentItem = null; // 재생 중 항목 (중단 시 ack용)
      function enqueuePresentation(item) {
        if (suppressAudioUntilNextTurn) { ack(item.seq); return; }
        if (item.seq <= flushUpTo) { ack(item.seq); return; } // 유저 발화 이전 대사 — 폐기
        audioQueue.push(item); // {seq, speaker, text, audio|null}
        if (!playing) playNext();
      }
      function playNext() {
        currentItem = null;
        playbackStarted = false;
        if (!audioQueue.length) { playing = false; return; }
        playing = true;
        const item = audioQueue.shift();
        if (item.seq <= flushUpTo) { ack(item.seq); playNext(); return; }
        currentItem = item;
        const gen = generation;
        let finished = false;
        const finish = () => {
          if (gen !== generation || finished) return;
          finished = true;
          ack(item.seq);
          playNext();
        };
        if (!item.audio) { // 합성 실패 → 자막만 표시하고 즉시 다음
          showSentence(item);
          finish();
          return;
        }
        player.src = 'data:audio/mpeg;base64,' + item.audio;
        player.onended = finish;
        player.onerror = finish;
        player.play().then(() => {
          if (gen !== generation || finished) return;
          playbackStarted = true;
          showSentence(item); // 재생 성공 순간 자막 표시 (문장 단위)
        }).catch((err) => {
          if (gen !== generation || finished) return;
          if (err && err.name === 'NotAllowedError' && !unlocked) {
            // 아직 제스처 전 — 항목을 되돌리고 안내. ack하지 않는다(서버가 기다려줌)
            audioQueue.unshift(item);
            playing = false;
            showSoundHint();
            return;
          }
          showSentence(item); // 기타 재생 실패 → 자막만
          finish();
        });
      }
      function ack(seq) {
        safeSend({ type: 'played', seq });
      }
      // 사용자가 끼어든 시점부터 브라우저 pause 적용까지의 지연을 함께 반환한다.
      // paused 외 결과는 실제 재생 중단 지연 표본에 포함하지 않는다.
      function stopAudio(measurementStartedAt = null, acknowledge = true) {
        generation += 1; // 재생 중이던 항목의 늦은 콜백(ended/catch) 무효화
        const interruptedItem = currentItem;
        const hadQueuedAudio = Boolean(currentItem || audioQueue.length);
        const wasAudible = Boolean(playing && currentItem && playbackStarted && !player.paused);
        let outcome = hadQueuedAudio ? 'queued_only' : 'idle';
        let stoppedAt;
        if (wasAudible) {
          try {
            player.pause();
            outcome = player.paused ? 'paused' : 'pause_failed';
          } catch (_) {
            outcome = 'pause_failed';
          }
          stoppedAt = performance.now();
        } else {
          if (playing) {
            try { player.pause(); } catch (_) {}
          }
          stoppedAt = performance.now();
        }

        let maxSeq = currentItem ? (currentItem.seq || 0) : 0;
        while (audioQueue.length) maxSeq = Math.max(maxSeq, audioQueue.shift().seq || 0);
        playing = false;
        playbackStarted = false;
        currentItem = null;
        if (acknowledge && maxSeq > 0) ack(maxSeq); // 서버 장부는 최고 seq 하나면 충분하다.

        const startedAt = Number.isFinite(measurementStartedAt) ? measurementStartedAt : stoppedAt;
        const audioStop = {
          outcome,
          elapsed_ms: Math.round(Math.max(0, stoppedAt - startedAt) * 1000) / 1000,
        };
        if (interruptedItem && interruptedItem.seq) {
          audioStop.segment_id = 'audio-' + interruptedItem.seq;
        }
        return { audioStop, maxSeq };
      }

      function resetPresentation(clearLog) {
        cleanupRecording();
        generation += 1;
        player.pause();
        player.removeAttribute('src');
        player.load();
        audioQueue.length = 0;
        playing = false;
        playbackStarted = false;
        currentItem = null;
        flushUpTo = 0;
        current = null;
        lastAi = null;
        activeSessionId = null;
        clientEventSequence = 0;
        activeHoldEventId = null;
        suppressAudioUntilNextTurn = false;
        audioSuppressionClientEventId = null;
        if (pendingStt) pendingStt.wrap.remove();
        pendingStt = null;
        if (clearLog) log.replaceChildren();
      }

      function handleMessage(d, socket, epoch) {
        if (socket !== ws || epoch !== connectionEpoch) return;
        if (d.type === 'hello') {
          voiceMode = d.voice; // 음성 모드면 토큰 라이브 표시 대신 오디오 동기 표시
          sttAvailable = d.stt;
          setSessionState('starting', '세션을 준비하고 있어요…');
          safeSend({ type: 'session_start' }, socket);
        } else if (d.type === 'session_started') {
          activeSessionId = String(d.session_id || ('connection-' + epoch));
          clientEventSequence = 0;
          activeHoldEventId = null;
          setSessionState('running', '대화 중, 언제든 끼어들 수 있어요.');
        } else if (d.type === 'you') {
          if (pendingStt) { // '듣는 중…' 자리에 전사 결과 채움
            pendingStt.body.textContent = d.text;
            pendingStt = null;
          } else {
            add('user', d.text);
          }
          voiceRequestClientEventId = null;
        } else if (d.type === 'start') {
          if (d.after_client_event_id === voiceRequestClientEventId) {
            clearVoiceRequest(voiceRequestClientEventId);
          }
          const mayResumeAudio = !suppressAudioUntilNextTurn
            || audioSuppressionClientEventId === null
            || d.after_client_event_id === audioSuppressionClientEventId;
          if (!mayResumeAudio) {
            current = null;
            return;
          }
          if (suppressAudioUntilNextTurn) {
            suppressAudioUntilNextTurn = false;
            audioSuppressionClientEventId = null;
          }
          if (voiceRequestClientEventId) clearVoiceRequest();
          current = voiceMode ? null : add(d.speaker, '');
        } else if (d.type === 'token') {
          if (current) current.body.textContent += d.text;
          log.scrollTop = log.scrollHeight;
        } else if (d.type === 'end') {
          if (current) current.body.textContent = d.text;
          current = null; // 음성 모드에선 audio 이벤트가 표시를 담당
        } else if (d.type === 'audio') {
          enqueuePresentation({ seq: d.seq, speaker: d.speaker, text: d.text, audio: d.audio, cont: d.cont });
        } else if (d.type === 'flush') {
          flushUpTo = Math.max(flushUpTo, d.seq); // 유저 발화 이전 대사는 이후 도착해도 폐기
          stopAudio();
        } else if (d.type === 'interrupted') {
          if (voiceMode) {
            if (d.text) add(d.speaker, d.text + ' —(끊김)'); // 끊긴 발화는 즉시 표시
          } else if (current) {
            current.body.textContent = (d.text || '') + ' —(끊김)';
          }
          current = null;
        } else if (d.type === 'error') {
          if (current) current.wrap.remove(); // 실패한 턴의 빈 버블 제거
          current = null;
        } else if (d.type === 'done') {
          // done은 합성과 전송이 끝났다는 뜻이며 브라우저 재생 완료는 아니다.
          // 마지막 음성을 자르지 않고, 다시 시작할 때만 오디오를 정리한다.
          cleanupRecording();
          setSessionState('ended', '대화가 끝났어요. 같은 화면에서 다시 시작할 수 있어요.');
          startBtn.focus();
          socket.close(1000);
        }
      }

      async function startSession() {
        if (!['idle', 'ended', 'error'].includes(sessionState)) return;
        const epoch = ++connectionEpoch;
        const previous = ws;
        ws = null;
        if (previous && previous.readyState < WebSocket.CLOSING) previous.close(1000);
        resetPresentation(true);
        sttAvailable = false;
        voiceMode = false;
        setSessionState('starting', '오디오를 준비하고 있어요…');

        if (!(await unlockAudio())) {
          if (epoch === connectionEpoch) {
            setSessionState('error', '오디오를 시작하지 못했어요. 다시 시도해 주세요.');
          }
          return;
        }
        if (epoch !== connectionEpoch) return;

        const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(scheme + '//' + location.host + '/ws');
        ws = socket;
        socket.onopen = () => {
          if (socket === ws && epoch === connectionEpoch) {
            setSessionState('starting', '서버에 연결하고 있어요…');
          }
        };
        socket.onmessage = (event) => {
          if (socket !== ws || epoch !== connectionEpoch) return;
          try {
            handleMessage(JSON.parse(event.data), socket, epoch);
          } catch (_) {
            socket.close(1002);
            setSessionState('error', '서버 메시지를 처리하지 못했어요. 다시 시도해 주세요.');
          }
        };
        socket.onerror = () => {};
        socket.onclose = () => {
          if (socket !== ws || epoch !== connectionEpoch) return;
          ws = null;
          if (sessionState === 'ended') return;
          resetPresentation(false);
          setSessionState('error', '연결이 끊겼어요. 다시 시작해 주세요.');
        };
      }

      startBtn.addEventListener('click', startSession);

      // push-to-talk는 누르는 동안 녹음하고 버튼을 놓으면 STT로 보낸다.
      let recorder = null;
      let activeStream = null;
      let recordingRequest = 0;
      let pressHeld = false;

      function releaseHold(clientEventId, socket = ws) {
        if (!clientEventId || activeHoldEventId !== clientEventId) return false;
        activeHoldEventId = null;
        return safeSend({ type: 'hold_off', client_event_id: clientEventId }, socket);
      }

      function nextClientEventId() {
        const sessionId = activeSessionId || ('connection-' + connectionEpoch);
        return sessionId + '-' + (++clientEventSequence);
      }

      function cleanupRecording() {
        pressHeld = false;
        recordingRequest += 1;
        activeHoldEventId = null;
        if (recorder) {
          recorder.ondataavailable = null;
          recorder.onstop = null;
          if (recorder.state === 'recording') recorder.stop();
          recorder = null;
        }
        if (activeStream) {
          activeStream.getTracks().forEach((track) => track.stop());
          activeStream = null;
        }
        micBtn.classList.remove('rec');
        micBtn.setAttribute('aria-pressed', 'false');
        clearVoiceRequest();
      }

      async function startRec() {
        if (sessionState !== 'running' || !ws || ws.readyState !== WebSocket.OPEN) return;
        if (voiceRequestClientEventId || pressHeld
          || (recorder && recorder.state === 'recording')) return;
        const gestureStartedAt = performance.now();
        pressHeld = true;
        const request = ++recordingRequest;
        const epoch = connectionEpoch;
        const socket = ws;
        const clientEventId = nextClientEventId();
        activeHoldEventId = clientEventId;
        suppressAudioUntilNextTurn = true;
        audioSuppressionClientEventId = clientEventId;
        const stopped = stopAudio(gestureStartedAt, false);
        safeSend({
          type: 'hold',
          client_event_id: clientEventId,
          audio_stop: stopped.audioStop,
        }, socket);
        if (stopped.maxSeq > 0) ack(stopped.maxSeq);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const stale = request !== recordingRequest || epoch !== connectionEpoch
            || socket !== ws || sessionState !== 'running' || !pressHeld;
          if (stale) {
            stream.getTracks().forEach((t) => t.stop());
            return;
          }

          activeStream = stream;
          const mediaRecorder = new MediaRecorder(stream, { audioBitsPerSecond: 128000 });
          const chunks = [];
          recorder = mediaRecorder;
          mediaRecorder.ondataavailable = (event) => chunks.push(event.data);
          mediaRecorder.onstop = async () => {
            pressHeld = false;
            stream.getTracks().forEach((track) => track.stop());
            if (activeStream === stream) activeStream = null;
            if (recorder === mediaRecorder) recorder = null;
            micBtn.classList.remove('rec');
            micBtn.setAttribute('aria-pressed', 'false');
            if (request !== recordingRequest || epoch !== connectionEpoch
              || socket !== ws || sessionState !== 'running') return;

            const blob = new Blob(chunks, { type: mediaRecorder.mimeType });
            if (blob.size < 8000) { // 스치듯 눌린 짧은 녹음 — 발화권 반납
              releaseHold(clientEventId, socket);
              return;
            }
            // 전사되는 동안의 무반응 공백을 없앤다 — 즉시 자리 표시
            pendingStt = add('user', '듣는 중...');
            voiceRequestClientEventId = clientEventId;
            const placed = pendingStt;
            setTimeout(() => { if (pendingStt === placed) { placed.wrap.remove(); pendingStt = null; } }, 10000);
            let b64;
            try {
              b64 = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = () => reject(new Error('audio read failed'));
                reader.onabort = () => reject(new Error('audio read aborted'));
                reader.readAsDataURL(blob);
              });
            } catch (_) {
              if (pendingStt === placed) clearVoiceRequest(clientEventId);
              if (request === recordingRequest && epoch === connectionEpoch
                && socket === ws && sessionState === 'running') {
                releaseHold(clientEventId, socket);
              }
              return;
            }
            if (request === recordingRequest && epoch === connectionEpoch
              && socket === ws && sessionState === 'running') {
              const sent = safeSend({
                type: 'voice',
                client_event_id: clientEventId,
                audio: b64,
                mime: mediaRecorder.mimeType,
              }, socket);
              if (sent && activeHoldEventId === clientEventId) {
                activeHoldEventId = null;
              } else if (!sent) {
                clearVoiceRequest(clientEventId);
              }
            } else if (pendingStt === placed) {
              clearVoiceRequest(clientEventId);
            }
          };
          mediaRecorder.start();
          micBtn.classList.add('rec');
          micBtn.setAttribute('aria-pressed', 'true');
        } catch (e) {
          if (request === recordingRequest && socket === ws) {
            releaseHold(clientEventId, socket);
            cleanupRecording();
            statusEl.textContent = '마이크 권한이 필요해요. 텍스트로도 참여할 수 있어요.';
          }
        }
      }
      function stopRec() {
        if (!pressHeld && (!recorder || recorder.state !== 'recording')) return;
        pressHeld = false;
        if (recorder && recorder.state === 'recording') {
          recorder.stop();
        } else {
          releaseHold(activeHoldEventId);
        }
        micBtn.classList.remove('rec');
        micBtn.setAttribute('aria-pressed', 'false');
      }
      micBtn.onpointerdown = startRec;
      micBtn.onpointerup = stopRec;
      micBtn.onpointerleave = stopRec;
      micBtn.onpointercancel = stopRec;

      form.onsubmit = (e) => {
        e.preventDefault();
        if (sessionState !== 'running' || !ws || ws.readyState !== WebSocket.OPEN) return;
        const v = input.value.trim();
        if (!v) return;
        if (activeHoldEventId) {
          releaseHold(activeHoldEventId);
          cleanupRecording();
        }
        const clientEventId = nextClientEventId();
        suppressAudioUntilNextTurn = true;
        audioSuppressionClientEventId = clientEventId;
        stopAudio(); // 끼어드는 순간 AI 목소리를 즉시 끊는다 (클라이언트 barge)
        add('user', v); // 내 발화는 로컬에서 바로 표시
        safeSend({ type: 'say', text: v, client_event_id: clientEventId });
        input.value = '';
      };

      setSessionState('idle', '준비되면 대화를 시작하세요.');
    </script>
  </body>
</html>
