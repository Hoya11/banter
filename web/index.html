<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>banter</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0 auto;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 640px;
      }
      header { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #8883; }
      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
      .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; line-height: 1.4; }
      .user { align-self: flex-end; background: #2563eb; color: #fff; }
      .ai_a { align-self: flex-start; background: #8882; }
      .ai_b { align-self: flex-start; background: #10b98133; }
      .name { font-size: 11px; opacity: 0.6; margin-bottom: 2px; }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #8883; }
      input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #8886; font-size: 15px; }
      button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; }
    </style>
  </head>
  <body>
    <header>banter — 도현 · 소은과 수다</header>
    <div id="log"></div>
    <form id="form">
      <input id="msg" autocomplete="off" placeholder="말 걸거나 끼어들어보세요…" />
      <button>전송</button>
    </form>
    <script>
      const NAMES = { user: '나', ai_a: '도현', ai_b: '소은' };
      const log = document.getElementById('log');

      function add(speaker, text) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + speaker;
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = NAMES[speaker] || speaker;
        const body = document.createElement('div');
        body.textContent = text;
        wrap.append(name, body);
        log.append(wrap);
        log.scrollTop = log.scrollHeight;
        return { wrap, body };
      }

      // 발화 오디오 순차 재생 — 단일 Audio 엘리먼트 재사용.
      // 브라우저 autoplay 정책상 사용자 제스처로 한번 재생된 엘리먼트만
      // 이후 프로그램 재생이 허용되므로, 첫 전송 때 무음으로 unlock한다.
      const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
      const player = new Audio();
      const audioQueue = [];
      let playing = false;
      let unlocked = false;
      player.onended = () => playNext();
      player.onerror = () => playNext();

      // 첫 사용자 제스처(아무 곳 탭/키)에서 오디오 재생 권한을 확보한다 —
      // 라디오는 유저 입력 전에 시작되므로 '전송' 버튼만으로는 청취 전용 유저가 무음이 된다.
      function unlockAudio() {
        if (unlocked) return;
        unlocked = true;
        hideSoundHint();
        player.src = SILENT_WAV;
        player.play().catch(() => {});
        if (!playing) playNext(); // 차단으로 되돌려둔 항목이 있으면 재개
      }
      document.addEventListener('pointerdown', unlockAudio, { once: true });
      document.addEventListener('keydown', unlockAudio, { once: true });

      function showSoundHint() {
        let el = document.getElementById('soundhint');
        if (!el) {
          el = document.createElement('div');
          el.id = 'soundhint';
          el.textContent = '🔈 화면을 한 번 탭하면 목소리가 재생돼요';
          el.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#2563eb;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:9';
          document.body.append(el);
        }
      }
      function hideSoundHint() {
        const el = document.getElementById('soundhint');
        if (el) el.remove();
      }

      // 음성 동기 모드: 말풍선은 그 발화의 오디오가 "재생되는 순간" 표시한다(자막).
      // 항목마다 서버가 준 seq로 played ack — 서버는 max(acked, seq)만 기억하므로
      // 중복 ack은 무해하고(멱등), stale 콜백의 이중 ack 문제도 사라진다.
      let generation = 0; // stopAudio마다 증가 — 이전 재생의 늦은 콜백을 무시
      let flushUpTo = 0; // 서버 flush 지시: 이 seq 이하 오디오는 stale — 표시 없이 ack만
      let currentItem = null; // 재생 중 항목 (중단 시 ack용)
      function enqueuePresentation(item) {
        if (item.seq <= flushUpTo) { ack(item.seq); return; } // 유저 발화 이전 대사 — 폐기
        audioQueue.push(item); // {seq, speaker, text, audio|null}
        if (!playing) playNext();
      }
      function playNext() {
        currentItem = null;
        if (!audioQueue.length) { playing = false; return; }
        playing = true;
        const item = audioQueue.shift();
        if (item.seq <= flushUpTo) { ack(item.seq); playNext(); return; }
        currentItem = item;
        const gen = generation;
        const finish = () => { if (gen !== generation) return; ack(item.seq); playNext(); };
        if (!item.audio) { // 합성 실패 → 자막만 표시하고 즉시 다음
          add(item.speaker, item.text);
          finish();
          return;
        }
        player.src = 'data:audio/mpeg;base64,' + item.audio;
        player.onended = finish;
        player.onerror = finish;
        player.play().then(() => {
          add(item.speaker, item.text); // 재생 성공 순간 자막 표시
        }).catch((err) => {
          if (err && err.name === 'NotAllowedError' && !unlocked) {
            // 아직 제스처 전 — 항목을 되돌리고 안내. ack하지 않는다(서버가 기다려줌)
            audioQueue.unshift(item);
            playing = false;
            showSoundHint();
            return;
          }
          add(item.speaker, item.text); // 기타 재생 실패 → 자막만
          finish();
        });
      }
      function ack(seq) {
        if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'played', seq }));
      }
      // 클라이언트 barge — 유저가 입력하는 순간 재생 중인 목소리를 끊고 큐를 비운다.
      // 버린 항목 중 최고 seq 하나만 ack하면 된다 (서버 장부가 max 기반이라).
      function stopAudio() {
        generation += 1; // 재생 중이던 항목의 늦은 콜백(ended/catch) 무효화
        let maxSeq = currentItem ? (currentItem.seq || 0) : 0;
        while (audioQueue.length) maxSeq = Math.max(maxSeq, audioQueue.shift().seq || 0);
        if (playing) player.pause();
        playing = false;
        currentItem = null;
        if (maxSeq > 0) ack(maxSeq); // 서버 장부가 max 기반이라 최고 seq 하나로 충분
      }

      const ws = new WebSocket('ws://' + location.host + '/ws');
      let voiceMode = false;
      let current = null; // (텍스트 모드) 스트리밍 중인 AI 발화 버블

      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.type === 'hello') {
          voiceMode = d.voice; // 음성 모드면 토큰 라이브 표시 대신 오디오 동기 표시
        } else if (d.type === 'start') {
          current = voiceMode ? null : add(d.speaker, '');
        } else if (d.type === 'token') {
          if (current) current.body.textContent += d.text;
          log.scrollTop = log.scrollHeight;
        } else if (d.type === 'end') {
          if (current) current.body.textContent = d.text;
          current = null; // 음성 모드에선 audio 이벤트가 표시를 담당
        } else if (d.type === 'audio') {
          enqueuePresentation({ seq: d.seq, speaker: d.speaker, text: d.text, audio: d.audio });
        } else if (d.type === 'flush') {
          flushUpTo = Math.max(flushUpTo, d.seq); // 유저 발화 이전 대사는 이후 도착해도 폐기
          stopAudio();
        } else if (d.type === 'interrupted') {
          if (voiceMode) {
            if (d.text) add(d.speaker, d.text + ' —(끊김)'); // 끊긴 발화는 즉시 표시
          } else if (current) {
            current.body.textContent = (d.text || '') + ' —(끊김)';
          }
          current = null;
        } else if (d.type === 'error') {
          if (current) current.wrap.remove(); // 실패한 턴의 빈 버블 제거
          current = null;
        } else if (d.type === 'done') {
          sessionEnded = true;
          endSession('세션이 마무리됐어요. 새로고침하면 다시 시작해요.');
        }
      };

      let sessionEnded = false; // done 후의 onclose가 안내 문구를 덮지 않게
      function endSession(text) {
        const input = document.getElementById('msg');
        input.disabled = true;
        input.placeholder = text;
      }

      ws.onclose = () => { if (!sessionEnded) endSession('연결이 끊겼어요. 새로고침하면 다시 시작해요.'); };
      ws.onerror = () => { if (!sessionEnded) endSession('연결 오류가 났어요. 새로고침하면 다시 시작해요.'); };

      document.getElementById('form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('msg');
        const v = input.value.trim();
        if (!v) return;
        stopAudio(); // 끼어드는 순간 AI 목소리를 즉시 끊는다 (클라이언트 barge)
        unlockAudio(); // 첫 제스처에서 오디오 재생 권한 확보 (stop 뒤에 — unlock 재생을 끊지 않게)
        add('user', v); // 내 발화는 로컬에서 바로 표시
        ws.send(JSON.stringify({ type: 'say', text: v }));
        input.value = '';
      };
    </script>
  </body>
</html>
