<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>banter</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0 auto;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 640px;
      }
      header { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #8883; }
      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
      .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; line-height: 1.4; }
      .user { align-self: flex-end; background: #2563eb; color: #fff; }
      .ai_a { align-self: flex-start; background: #8882; }
      .ai_b { align-self: flex-start; background: #10b98133; }
      .name { font-size: 11px; opacity: 0.6; margin-bottom: 2px; }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #8883; }
      input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #8886; font-size: 15px; }
      button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; }
    </style>
  </head>
  <body>
    <header>banter — 도현 · 소은과 수다</header>
    <div id="log"></div>
    <form id="form">
      <input id="msg" autocomplete="off" placeholder="말 걸거나 끼어들어보세요…" />
      <button>전송</button>
    </form>
    <script>
      const NAMES = { user: '나', ai_a: '도현', ai_b: '소은' };
      const log = document.getElementById('log');

      function add(speaker, text) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + speaker;
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = NAMES[speaker] || speaker;
        const body = document.createElement('div');
        body.textContent = text;
        wrap.append(name, body);
        log.append(wrap);
        log.scrollTop = log.scrollHeight;
        return { wrap, body };
      }

      const ws = new WebSocket('ws://' + location.host + '/ws');
      let current = null; // 스트리밍 중인 AI 발화 버블

      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.type === 'start') {
          current = add(d.speaker, ''); // 빈 버블로 시작
        } else if (d.type === 'token') {
          if (current) current.body.textContent += d.text; // 한 글자씩 append
          log.scrollTop = log.scrollHeight;
        } else if (d.type === 'end') {
          if (current) current.body.textContent = d.text; // 최종본(프리픽스 제거 반영)
          current = null;
        } else if (d.type === 'done') {
          const input = document.getElementById('msg');
          input.disabled = true;
          input.placeholder = '세션이 마무리됐어요. 새로고침하면 다시 시작해요.';
        }
      };

      document.getElementById('form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('msg');
        const v = input.value.trim();
        if (!v) return;
        add('user', v); // 내 발화는 로컬에서 바로 표시
        ws.send(v);
        input.value = '';
      };
    </script>
  </body>
</html>
